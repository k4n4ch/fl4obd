<!DOCTYPE html>
<!--
  dashcam.html — ドライブレコーダー単体の走行ビューア

  前後映像 + NMEA だけで成立する。OBD も スマホ GPX も要らない。
  Honda 純正ドラレコ（DRH-224SD / 08E30-PM5-C04A、JVCKENWOOD OEM）で検証。
  MP4 と同名の .NMEA を書く機種であれば、機種判定 PROFILES を足せば流用できる。

  出せるもの: 前後映像の同期再生 / 地図（経路・現在位置） / 車速（位置差分）
              標高・勾配 / 前後左右G（$GSENS 10Hz の内蔵IMU）
  出せないもの: パワー・SOC・電費・走行モード（OBD が要る → video.html）
              測位途絶（トンネル）の経路補完（車速の積分が要る → video.html）

  同期・セッション判定・アンカーは video/sync.js を video.html と共有する。
  根拠と落とし穴は embedded/knowledge/dashcam-obd-time-sync.md を参照。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドライブレコーダー 走行ビューア</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#05080c; color:#cfe; font:12px/1.4 system-ui,sans-serif; overflow:hidden; }
  /* ── ローダ ── */
  #loader { display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; height:100%; padding:20px; overflow:auto; }
  #loader h1 { font-size:16px; color:#4a9eff; margin:0; }
  .drop { border:1px dashed #2a5a8c; border-radius:8px; padding:14px 20px; background:#0d1520; min-width:340px; }
  .drop label { display:block; margin:8px 0 2px; color:#8ab; }
  .drop input { width:100%; color:#cfe; }
  .drop .hint { color:#68a; font-size:10px; margin-top:2px; }
  /* 走行の一覧。フォルダ内の全クリップを開始時刻で塊に分けたもの */
  .sess { display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
          padding:8px 12px; margin-bottom:4px; background:#0d1520; border:1px solid #1a3a5a;
          border-radius:6px; color:#cfe; cursor:pointer; font-variant-numeric:tabular-nums; }
  .sess:hover { background:#122840; border-color:#4a9eff; }
  .sess .sd { color:#4a9eff; font-size:14px; }
  .sess .sl { color:#cfe; }
  .sess .sn { color:#6f8ba0; font-size:11px; margin-left:auto; }
  button { padding:9px 16px; background:#0d1e30; border:1px solid #2a5a8c; color:#cfe; border-radius:6px; cursor:pointer; }
  button:hover { background:#122840; border-color:#4a9eff; }
  button:disabled { opacity:.4; cursor:default; }
  #msg { color:#c85; min-height:16px; white-space:pre-wrap; max-width:760px; font-size:11px; }
  /* ── アプリ ── */
  #app { display:none; flex-direction:column; height:100%; }
  #app.on { display:flex; }
  #stageWrap { flex:1; position:relative; overflow:hidden; }
  /* 出力と同一の 1920x1080。ここに映るものがそのまま書き出し対象になる */
  #stage { position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:top left; background:#000; }
  #stage > div { position:absolute; overflow:hidden; background:#0a1520; }
  /* 640×360 格子。前方は 2×2、地図は右列に縦へ並べて隣接させる（地図どうしを離さない） */
  #vcell   { left:0;     top:0;   width:1280px; height:720px; background:#000; }
  #rearcell{ left:1280px; top:0;   width:640px;  height:360px; background:#000; }
  #navcell { left:1280px; top:360px; width:640px; height:360px; }
  #ovcell  { left:1280px; top:720px; width:640px; height:360px; }
  #graphcell{ left:0;    top:720px; width:1280px; height:360px; }
  #graphcell svg { width:100%; height:100%; display:block; }
  #vcell video, #rearcell video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #vcell video.off, #rearcell video.off { visibility:hidden; }
  .lmap { position:absolute; inset:0; }
  .tag { position:absolute; top:6px; left:8px; z-index:500; background:#000a; padding:2px 8px; border-radius:3px; color:#7ac; font-size:14px; pointer-events:none; }
  .hud { position:absolute; bottom:6px; left:8px; z-index:500; background:#000b; padding:4px 9px; border-radius:4px; font-size:15px; pointer-events:none; white-space:pre; font-variant-numeric:tabular-nums; }
  /* ── コントロール(ステージ外＝出力に映らない) ── */
  #ctrl { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:6px 10px; background:#0d1218; border-top:1px solid #1c2836; }
  #seek { flex:1 1 320px; }
  .spd { padding:3px 8px; background:#0d1520; border:1px solid #1a3a5a; color:#5a8; border-radius:4px; cursor:pointer; font-size:11px; user-select:none; }
  .spd.on { border-color:#ffaa00; color:#ffaa00; }
  #tlabel { margin-left:auto; color:#8ab; font-variant-numeric:tabular-nums; }
  #warn { color:#c85; font-size:10px; flex:1 1 100%; white-space:pre-wrap; }
  .leaflet-container { background:#0d1218; }
  /* ── 書き出しパネル（ステージ外・出力に映らない） ── */
  #expPanel { display:none; position:fixed; inset:0; background:#000c; z-index:2000; align-items:center; justify-content:center; }
  #expPanel.on { display:flex; }
  #expCard { background:#0d1520; border:1px solid #2a5a8c; border-radius:8px; padding:16px 20px; width:min(560px,92vw); max-height:88vh; overflow:auto; }
  #expCard label { display:block; margin:8px 0 2px; color:#8ab; font-size:11px; }
  #expCard input[type=text], #expCard select { width:100%; padding:5px 7px; background:#0a1018; border:1px solid #1a3a5a; color:#cfe; border-radius:4px; }
  /* 地図の帰属表示。地図画像を含む成果物を出す以上、再生でも書き出しでも必ず出す */
  .attrib { position:absolute; right:6px; bottom:5px; z-index:500; background:#0009; padding:1px 5px;
            border-radius:3px; color:#9ab; font-size:11px; pointer-events:none; white-space:nowrap; }
  /* ── 書き出しパネル ── */
</style>
</head>
<body>

  <h1>ドライブレコーダー 走行ビューア</h1>
  <div class="drop">

    <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">

<div id="app">

    <div id="ovcell"><div class="lmap" id="mapOv"></div><div class="tag">俯瞰</div><div class="hud" id="hudOv"></div><div class="attrib" id="atOv"></div></div>
    <div id="graphcell"><svg id="graphSvg" viewBox="0 0 1280 360" preserveAspectRatio="none"></svg></div>

  <div id="ctrl">
    <button id="playBtn" style="width:40px">▶</button>

      <h3 style="margin:0 0 8px; color:#4a9eff; font-size:14px">オーバーレイ書き出し</h3>
      <div style="color:#8ab; margin-bottom:8px; font-size:11px">地図とグラフを 1 本のファイルに書き出す。映像との合成はローカルの ffmpeg 1 コマンドで行う。</div>
      <label>オーバーレイ fps</label>
      <select id="expFps"><option value="10" selected>10 (推奨)</option><option value="5">5 (容量半分)</option><option value="15">15</option></select>
      <label>JPEG 品質 <span id="expQv">82</span></label>
      <input type="range" id="expQ" min="60" max="95" value="82" style="width:100%">
      <label>ドラレコ SD の絶対パス（concat リスト生成用）</label>
      <input type="text" id="expRoot" placeholder="例) macOS: /Volumes/NO NAME  /  Windows: E:\">
      <label>出力先フォルダ</label>
      <div style="display:flex; gap:8px; align-items:center; margin:4px 0 8px">
        <button id="expPick">フォルダを選択</button><span id="expDir" style="color:#8ab"></span>
      </div>
      <div id="expStat" style="color:#5a8; min-height:40px; white-space:pre-wrap; font-variant-numeric:tabular-nums; font-size:11px"></div>
      <div style="display:flex; gap:8px; margin-top:6px">
        <button id="expGo">開始</button><button id="expStop">中止</button><button id="expClose">閉じる</button>
      </div>
    </div>
  </div>
  <!-- 書き出し用。SVG 本体には style を付けない（クローンに position:absolute が残ると
       単体画像として描画したとき root ごと画面外に飛び、完全に空白になる） -->
  <div style="position:absolute; left:-9999px; top:0; width:1920px; height:1080px">
    <svg id="expGraph" viewBox="0 0 1280 360" width="1280" height="360"></svg>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { parseNmea, parseMp4Meta, buildManifest, makeTimeline, haversineMeters, speedFromPositions, fillTrackGaps } from './video/sync.js';
import { drawGraph } from './lib/graph.js';
import { TileCache, makeView, fitView, zoomForSpan, drawTiles, drawRoute, drawDot, visibleRange, TILE_STYLES, drawAttribution } from './video/tilemap.js';

const $ = (id) => document.getElementById(id);
const msg = (s) => { $('msg').textContent = s; };
const FOLLOW_SPAN_M = 700;      // ナビが映す実距離(m)
const PRELOAD_SEC = 4;          // 次クリップの先読み開始（残り秒）

let MAN = null, TL = null, TRACK = [], CLIPS = new Map();   // name → {file, S0, duration}
let clipOrder = [], winS0 = 0, winS1 = 0, S = 0, playing = false, rate = 1;
let mapNav, mapOv, curNav, curOv, navPos = null, TMETA = [], GSNS = [], SPD = [], SPD_EST = [], FILLS = [];
let lastHudKey = null, lastGraphUtc = -1e9, perf = { n: 0, sum: 0, t: 0 };   // 描画スロットリングと計測
let rearOn = true;   // リア映像の有効/無効（720p を2本同時にデコードするコストの切り分け用にも使う）
let act = 0;                                                          // 0=vA, 1=vB
const V = [], VR = [];   // 前方 / リア（各2枚のダブルバッファ）
let pending = { idx: -1, ready: false };

// ─────────────────────────────── ファイル収集
async function collectFromDirectory(handle) {
  const out = [];
  const walk = async (dir, prefix) => {
    for await (const [name, h] of dir.entries()) {
      if (name.startsWith('.')) continue;
      if (h.kind === 'directory') await walk(h, prefix + name + '/');
      else out.push({ name, path: prefix + name, getFile: () => h.getFile() });
    }
  };
  await walk(handle, '');
  return out;
}
function collectFromInput(files) {
  return [...files].map((f) => ({ name: f.name, path: f.webkitRelativePath || f.name, getFile: async () => f }));
}

/*
 * 読み込みは2段階に分ける。
 *  ① scanSessions … NMEA の先頭 4KB だけ読んで開始時刻を得て、走行の塊に分ける。
 *  ② load          … 選ばれた走行のクリップだけを全文解析する。
 * SD には数日分が入っているので、全 NMEA を全文解析すると数十MBが無駄になる
 * （実測 215本/28MB に対し必要なのは29本）。①を先に見せて選ばせることで、
 * 「どの走行か」をユーザーが決められるようにしつつ、②の対象は最小限に保つ。
 */
async function scanSessions(entries) {
  const ext = (p) => (p.split('.').pop() || '').toLowerCase();
  const mp4 = entries.filter((e) => ext(e.path) === 'mp4');
  const nme = entries.filter((e) => ext(e.path) === 'nmea');
  if (!mp4.length) throw new Error('MP4 が見つからない');
  if (!nme.length) throw new Error('NMEA が見つからない（時刻同期に必要）');
  msg(`NMEA を解析中… (${nme.length})`);

  const base = (p) => p.split('/').pop().replace(/\.[^.]+$/, '');
  const nmeaByBase = new Map();
  for (const e of nme) nmeaByBase.set(base(e.path), e);

  // 同名 MP4 が複数ある機種（前方/後方カメラ）: パス階層が浅い方を前方、次をリア扱いにする
  const cands = new Map();
  for (const e of mp4) {
    const b = base(e.path);
    if (!nmeaByBase.has(b)) continue;
    if (!cands.has(b)) cands.set(b, []);
    cands.get(b).push({ entry: e, depth: e.path.split('/').length });
  }
  const byBase = new Map();
  for (const [b, list] of cands) {
    list.sort((x, y) => x.depth - y.depth);
    byBase.set(b, { entry: list[0].entry, depth: list[0].depth, rearEntry: list[1] ? list[1].entry : null });
  }
  if (!byBase.size) throw new Error('MP4 と同名の NMEA が対応付かない');

  const BATCH = 8;
  const keys = [...byBase.keys()];
  const starts = new Map();
  for (let i = 0; i < keys.length; i += BATCH) {
    await Promise.all(keys.slice(i, i + BATCH).map(async (b) => {
      try {
        const f = await nmeaByBase.get(b).getFile();
        const r = parseNmea(await f.slice(0, 4096).text());   // 先頭だけ。切れた末尾行はチェックサムで弾かれる
        if (r.fixes.length) starts.set(b, r.fixes[0].t);
      } catch (e) { /* 読めなければ「不明」として候補に残す */ }
    }));
    if (i % 64 === 0) msg(`クリップを絞り込み中… ${Math.min(i + BATCH, keys.length)}/${keys.length}`);
  }
  /*
   * 開始時刻を「15分以上空いたら別の走行」で塊に分ける。
   * 開始時刻が取れなかったものは「不明」として必ず候補に残す（落としてはいけない）。
   * 録画開始直後は GPS 未測位（$GPRMC の status=V）で先頭に有効 fix が無い場合があり、
   * 実測でも 188本中10本が該当した。
   */
  const known = [...starts.entries()].sort((a, b) => a[1] - b[1]);
  if (!known.length) throw new Error('測位のあるクリップが1本も無い');
  const runs = [[known[0]]];
  for (let i = 1; i < known.length; i++) {
    if (known[i][1] - known[i - 1][1] > 900) runs.push([]);
    runs[runs.length - 1].push(known[i]);
  }
  // クリップ長は MP4 を読むまで分からないので、開始時刻の間隔の中央値で代用して尺を見積もる
  const gaps = [];
  for (const r of runs) for (let i = 1; i < r.length; i++) gaps.push(r[i][1] - r[i - 1][1]);
  gaps.sort((a, b) => a - b);
  const clipLen = gaps.length ? gaps[gaps.length >> 1] : 120;
  const sessions = runs.map((r) => ({
    from: r[0][1], to: r[r.length - 1][1] + clipLen, n: r.length,
    keys: r.map((x) => x[0]),
  })).sort((a, b) => b.from - a.from);          // 新しい走行を上に
  return { byBase, nmeaByBase, keys, starts, sessions, nUnknown: keys.filter((b) => !starts.has(b)).length };
}

// ─────────────────────────────── 選ばれた走行を全文解析 → 同期
async function load(scan, sess) {
  const T0 = performance.now(); const lap = [];
  const mark = (name) => { lap.push(`${name} ${((performance.now() - T0) / 1000).toFixed(1)}s`); };
  const BATCH = 8;
  const { byBase, nmeaByBase, keys, starts } = scan;
  const t0 = sess.from - 900, t1 = sess.to + 900;
  const cand = keys.filter((b) => {
    const t = starts.get(b);
    return t == null || (t >= t0 - 1500 && t <= t1 + 900);
  });
  mark(`対象 ${cand.length}/${keys.length}本（開始時刻不明 ${scan.nUnknown}本を含む）`);
  if (!cand.length) throw new Error('候補クリップが無い');

  const clips = [];
  for (let i = 0; i < cand.length; i += BATCH) {
    msg(`クリップを解析中… ${Math.min(i + BATCH, cand.length)}/${cand.length}`);
    const got = await Promise.all(cand.slice(i, i + BATCH).map(async (b) => {
      const { entry, depth, rearEntry } = byBase.get(b);
      const { fixes, gsens, signatures } = parseNmea(await (await nmeaByBase.get(b).getFile()).text());
      // 測位ゼロ（トンネル等）でも捨てない。時間で絞れないので候補に残し、
      // セッション分割（creation_time の連続性）で正しい位置に落ちるのに任せる。
      // 捨てると録画が前後で分断され、片側しか表示されなくなる。
      if (fixes.length && (fixes[fixes.length - 1].t < t0 || fixes[0].t > t1)) return null;   // ここで厳密に絞る
      const file = await entry.getFile();
      const rearFile = rearEntry ? await rearEntry.getFile() : null;
      let meta;
      try {
        meta = await parseMp4Meta(async (off, len) => await file.slice(off, off + len).arrayBuffer(), file.size);
      } catch (e) { console.warn(b, e.message); return null; }
      return { name: b, channelRank: depth, creationTime: meta.creationTime, duration: meta.duration,
               nmeaFirst: fixes.length ? fixes[0].t : NaN,
               nmeaLast: fixes.length ? fixes[fixes.length - 1].t : NaN, fixes, gsens, signatures, file, rearFile,
               path: entry.path, rearPath: rearEntry ? rearEntry.path : null };
    }));
    for (const c of got) if (c) clips.push(c);
  }
  if (!clips.length) throw new Error('解析できたクリップが無い');

  mark(`全文解析(${clips.length}本採用)`);
  msg('時刻同期を計算中…');
  // OBD も GPX も使わない。映像＋NMEA だけで同期・地図・標高が成立する。
  MAN = buildManifest({ clips, obd: null, gpx: null });
  TL = makeTimeline(MAN);
  mark('同期計算');

  for (const c of MAN.session.clips) {
    const src = clips.find((x) => x.name === c.name);
    if (src) CLIPS.set(c.name, { file: src.file, rearFile: src.rearFile, path: src.path, rearPath: src.rearPath,
                                 S0: c.S0, duration: c.duration, url: null, rearUrl: null });
  }
  clipOrder = MAN.session.clips.filter((c) => CLIPS.has(c.name)).map((c) => c.name);

  // マップ用トラック: 常に NMEA（理由は sync.js の mapSource 参照）
  TRACK = clips.flatMap((c) => c.fixes).sort((a, b) => a.t - b.t);

  /*
   * 測位途絶（トンネル等）の経路を OSM（OSRM）から補って地図に出す。
   * 距離の配分は「経路長 ÷ 途絶時間の一定速度」。OBD 車速が無いので速度は測れないが、
   * 総距離（経路長）と総時間（途絶時間）は分かるため、位置は復元できる。
   * 標高・勾配は走行抵抗からの逆算が要るので復元しない（補完点の ele は null）。
   */
  FILLS = [];
  msg('測位途絶の経路を補完中…');
  try {
    const r = await fillTrackGaps(TRACK, [], {});      // OBD 無し
    TRACK = r.fixes;
    FILLS = r.reports;
    console.log('[途絶補完]', r.reports.length + '箇所', r.reports,
                '補完点', r.fixes.filter((f) => f.estimated).length);
  } catch (e) { console.error('[途絶補完] 失敗', e); }
  mark('途絶補完');

  // 前後左右G: ドラレコ内蔵IMU($GSENS 10Hz)。ドラレコ自身のNMEA由来なので既に映像と同一時間軸。
  // 単位は g（GPS由来の縦/横加速度と突合して確認: X=前後 r0.925 / Y=左右 r0.806、係数とも 1g=9.81 近傍）。
  const sessNames = new Set(MAN.session.clips.map((c) => c.name));
  const graw = clips.filter((c) => sessNames.has(c.name)).flatMap((c) => c.gsens || []).sort((a, b) => a.t - b.t);
  GSNS = graw.map((g, i) => {                     // ±2サンプル(±0.2s)平滑で表示のちらつきを抑える
    let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - 2); j <= Math.min(graw.length - 1, i + 2); j++) { sx += graw[j].acc[0]; sy += graw[j].acc[1]; n++; }
    return { t: g.t, gx: sx / n, gy: sy / n };
  });

  buildSpeed();
  buildGraphSeries();
  mark('グラフ系列');

  winS0 = TL.utcToS(MAN.window.startUtc);
  winS1 = TL.utcToS(MAN.window.endUtc);
  if (!(winS1 > winS0)) throw new Error('映像と NMEA の共通区間が無い');
  mark(`G系列(${GSNS.length}点)`);
  MAN.timing = lap;
  return MAN;
}

// ─────────────────────────────── マップ
const TILE_KEY = 'dashcam.tilestyle';
// 既定はライト(OSM)。地名や施設名が読めるので「どこを走ったか」を追いやすい。
// 選択は localStorage に残るので、変えれば次回から引き継がれる。
let tileStyle = localStorage.getItem(TILE_KEY) || 'light';
if (!TILE_STYLES[tileStyle]) tileStyle = 'light';
let tileLayers = [];
function tiles() {
  const l = L.tileLayer(TILE_STYLES[tileStyle].url, { maxZoom: 19, attribution: '' });
  tileLayers.push(l);
  return l;
}
function applyTileStyle() {
  const st = TILE_STYLES[tileStyle];
  for (const l of tileLayers) l.setUrl(st.url);
  for (const id of ['atNav', 'atOv']) { const e = $(id); if (e) e.textContent = st.attrib; }
}
function trackAt(utc) {
  if (!TRACK.length) return null;
  if (utc <= TRACK[0].t) return { ...TRACK[0], i: 0 };
  const last = TRACK.length - 1;
  if (utc >= TRACK[last].t) return { ...TRACK[last], i: last };
  let lo = 0, hi = last, r = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (TRACK[m].t <= utc) { r = m; lo = m + 1; } else hi = m - 1; }
  const a = TRACK[r], b = TRACK[Math.min(r + 1, last)];
  const f = b.t > a.t ? (utc - a.t) / (b.t - a.t) : 0;
  return { lat: a.lat + (b.lat - a.lat) * f, lon: a.lon + (b.lon - a.lon) * f, i: r };
}
/*
 * 経路の色。OBD が無いので走行モードでは塗れない。車速で段階的に色を変える。
 * 区切りは日本の制限速度に合わせた丸い数字にする（30/60/80/100）。
 * 連続グラデーションにすると区間が細切れになって Leaflet のポリライン数が跳ねるので段階にする。
 * 色と太さは同じ表から引き、しきい値が二重管理にならないようにする。
 */
// 上限で書く。「30以下 / 60以下 / …」と読めるようにするため（切り替わりは 30→31）
const SPD_STEPS = [
  { max:  30, col: '#4a6a80', w: 3 },   // 停止・生活道路
  { max:  60, col: '#4dd08a', w: 3 },   // 市街地
  { max:  80, col: '#ffd24a', w: 4 },   // 幹線
  { max: 100, col: '#ff9a44', w: 4 },   // 自動車専用
  { max: Infinity, col: '#ff5a5a', w: 5 },   // 高速巡航
];
function spdStep(v) {
  for (const s of SPD_STEPS) if (v <= s.max) return s;
  return SPD_STEPS[SPD_STEPS.length - 1];
}
const spdColor = (v) => spdStep(v).col;
const spdWeight = (v) => spdStep(v).w;
function buildMaps() {
  const pts = TRACK.map((p) => [p.lat, p.lon]);
  const meta = TRACK.map((p) => ({ spd: spdAt(p.t) }));
  TMETA = meta;
  const draw = (map) => {
    /*
     * 白フチ → 本線。車速で色と太さを変える。
     * 補完区間（測位途絶を OSM の経路で埋めた部分）は破線・白フチ無しにして実測と区別する。
     * 補完できなかった途絶では線を切る。繋ぐと走っていない直線が描かれるため。
     */
    let cur = null; const runs = [];
    for (let i = 0; i < pts.length; i++) {
      const col = spdColor(meta[i].spd), w = spdWeight(meta[i].spd), est = !!TRACK[i].estimated;
      const cut = i > 0 && TRACK[i].t - TRACK[i - 1].t > 10;
      if (!cur || cut || cur.col !== col || cur.w !== w || cur.est !== est) {
        if (cur && !cut) cur.pts.push(pts[i]);         // 色/太さの境界では線を切らない（1点重ねる）
        cur = { col, w, est, pts: [pts[i]] }; runs.push(cur);
      } else cur.pts.push(pts[i]);
    }
    for (const r of runs) if (!r.est) L.polyline(r.pts, { color: '#f4f8ff', weight: r.w + 3, opacity: .85, lineCap: 'round', interactive: false }).addTo(map);
    for (const r of runs) L.polyline(r.pts, Object.assign(
      { color: r.col, weight: r.w, opacity: r.est ? 0.75 : 1, lineCap: 'round', interactive: false },
      r.est ? { dashArray: '5 4' } : {})).addTo(map);
    L.circleMarker(pts[0], { radius: 6, color: '#2ecc71', fillColor: '#2ecc71', fillOpacity: 1, weight: 1, interactive: false }).addTo(map);
    L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#e74c3c', fillColor: '#e74c3c', fillOpacity: 1, weight: 1, interactive: false }).addTo(map);
    return L.circleMarker(pts[0], { radius: 8, color: '#fff', fillColor: '#4a9eff', fillOpacity: 1, weight: 3, interactive: false }).addTo(map);
  };
  mapOv = L.map('mapOv', { zoomControl: false, attributionControl: false, preferCanvas: true, keyboard: false });
  tiles().addTo(mapOv); curOv = draw(mapOv);
  mapOv.fitBounds(L.latLngBounds(pts).pad(0.1));
  mapNav = L.map('mapNav', { zoomControl: false, attributionControl: false, preferCanvas: true, keyboard: false, dragging: false });
  tiles().addTo(mapNav); curNav = draw(mapNav);
  mapNav.setView(pts[0], 16);
  applyTileStyle();
  setTimeout(() => {
    mapOv.invalidateSize(); mapNav.invalidateSize();
    mapNav.setZoom(mapNav.getBoundsZoom(L.latLng(pts[0]).toBounds(FOLLOW_SPAN_M)));
  }, 80);
}

// ─────────────────────────────── 描画
function fmt(s) { s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
/*
 * グラフ系列。並びは「因果が上から下へ流れる」ように固定する:
 *   ① 標高と勾配（地形＝入力） ② 車速（応答） ③ 前後左右G（運転操作）
 * OBD が無いので「なぜその速度になったか」の中間層（パワー・エンジン）は出せない。
 * 地形 → 速度 → 操作 の3段になる。時間軸は全系列ドラレコ UTC。
 */
let GPANELS = null;
const GRAPH_SPAN = 120;      // 表示幅[秒]（±60s）

/*
 * 車速は位置差分から出す。OBD 車速との実測一致は中央 0.5km/h（95% 1.6km/h）。
 * 補完区間では位置自体が仮定（一定速度で配分）なので、そこから出る速度も仮定値。
 * 実測と同じ線で描かないよう、点ごとに区別できるフラグを一緒に作る。
 */
function buildSpeed() {
  const est = new Map();
  for (const p of TRACK) if (p.estimated) est.set(p.t, true);
  const q = speedFromPositions(TRACK);
  SPD = q.map((x) => [x.t, x.v]);
  SPD_EST = q.map((x) => est.has(x.t));
}
function spdAt(t) {
  if (!SPD.length) return 0;
  let lo = 0, hi = SPD.length - 1;
  if (t <= SPD[0][0]) return SPD[0][1];
  if (t >= SPD[hi][0]) return SPD[hi][1];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (SPD[m][0] <= t) lo = m; else hi = m; }
  return SPD[lo][1];
}
function gAtIdx(t) {
  if (!GSNS.length) return null;
  let lo = 0, hi = GSNS.length - 1;
  if (t < GSNS[0].t || t > GSNS[hi].t) return null;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (GSNS[m].t <= t) lo = m; else hi = m; }
  return GSNS[lo];
}

function buildGraphSeries() {
  GPANELS = null;
  if (!TRACK.length) return;
  // 標高: GPS 標高はスパイクが乗るので距離窓 ±30m で平滑し、60m 基線で勾配を出す
  const cum = [0];
  for (let i = 1; i < TRACK.length; i++)
    cum[i] = cum[i - 1] + haversineMeters(TRACK[i - 1].lat, TRACK[i - 1].lon, TRACK[i].lat, TRACK[i].lon);
  const eleSm = TRACK.map((p, i) => {
    if (p.ele == null) return null;
    let s = 0, n = 0;
    for (let j = i; j >= 0 && cum[i] - cum[j] <= 30; j--) if (TRACK[j].ele != null) { s += TRACK[j].ele; n++; }
    for (let j = i + 1; j < TRACK.length && cum[j] - cum[i] <= 30; j++) if (TRACK[j].ele != null) { s += TRACK[j].ele; n++; }
    return n ? s / n : p.ele;
  });
  const elePts = [], gradPts = [];
  for (let i = 0; i < TRACK.length; i++) {
    if (eleSm[i] == null) continue;
    let j = i; while (j > 0 && cum[i] - cum[j] < 60) j--;
    // 勾配の基線が測位途絶をまたぐと、跨いだ距離が実際の走行経路と一致せず値が壊れる
    let spans = false;
    for (let k = j + 1; k <= i; k++) if (TRACK[k].t - TRACK[k - 1].t > 10) { spans = true; break; }
    const dd = cum[i] - cum[j];
    elePts.push([TRACK[i].t, eleSm[i]]);
    gradPts.push([TRACK[i].t, (!spans && dd > 1 && eleSm[j] != null) ? ((eleSm[i] - eleSm[j]) / dd) * 100 : NaN]);
  }
  /*
   * 自動スケールには**最小スパン**を与える。素の自動だと値が動かない区間でレンジが縮み
   * ノイズが拡大され、固定レンジだと低速域で線が下端に張り付いて死ぬ。
   * 標高と勾配だけは全区間の最大最小で**縦軸を固定**する。窓ごとに自動スケールすると
   * 走行位置で基準が動き、起伏の大小を比較できなくなる。地形は絶対量で見たい。
   */
  const rangeOf = (pts, minSpan, padPct) => {
    let lo = Infinity, hi = -Infinity;
    for (const [, v] of pts) if (Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    if (!Number.isFinite(lo)) return null;
    const pad = Math.max((hi - lo) * padPct, 0.5);
    lo -= pad; hi += pad;
    if (hi - lo < minSpan) { const c = (lo + hi) / 2; lo = c - minSpan / 2; hi = c + minSpan / 2; }
    return [lo, hi];
  };
  // 再生位置が補完区間かどうか（凡例の注記用）
  const estT = TRACK.filter((p) => p.estimated).map((p) => p.t);
  const estAt = (t) => {
    if (!estT.length) return false;
    let lo = 0, hi = estT.length - 1;
    if (t < estT[0] - 2 || t > estT[hi] + 2) return false;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (estT[m] <= t) lo = m; else hi = m; }
    return Math.abs(estT[lo] - t) < 3 || Math.abs(estT[hi] - t) < 3;
  };
  GPANELS = [
    { h: 120, yl: rangeOf(elePts, 30, 0.06), yr: rangeOf(gradPts, 8, 0.06), series: [
        { name: '標高', color: '#8fbf6f', pts: elePts, fill: true, fmt: (v) => v.toFixed(0) + 'm' },
        { name: '勾配', color: '#c98fef', axis: 'R', pts: gradPts, w: 1.3, fmt: (v) => v.toFixed(1) + '%' },
      ] },
    { h: 120, minL: 40, zeroL: true, flag: (t) => (estAt(t) ? '（推定）' : null), series: [
        { name: '車速', color: '#e8f0f8', pts: SPD, fill: true,
          segDash: (i) => (SPD_EST[i] ? '5 4' : null), fmt: (v) => v.toFixed(0) + 'km/h' },
      ] },
    // G は 0 を中心に対称にする。加速と減速を同じ物差しで見たい
    { h: 120, zero: true, symL: true, minL: 0.6, symR: true, minR: 0.6, series: [
        { name: '前後G', color: '#4dd08a', pts: GSNS.map((g) => [g.t, g.gx]), fmt: (v) => v.toFixed(2) + 'G' },
        { name: '左右G', color: '#ff9a44', axis: 'R', pts: GSNS.map((g) => [g.t, g.gy]), w: 1.3, fmt: (v) => v.toFixed(2) + 'G' },
      ] },
  ];
}

function render() {
  const utc = TL.sToUtc(S);
  const g = gAtIdx(utc);                   // GSENS は映像と同一時間軸（オフセット補正なし）
  const v = spdAt(utc);
  // 元データは GPS 1Hz / G 10Hz しか変わらないので、60fps で HUD を作り直さない
  const hkey = (v * 10 | 0) + '|' + (g ? (g.gx * 100 | 0) + ',' + (g.gy * 100 | 0) : '-');
  if (hkey !== lastHudKey) {
    lastHudKey = hkey;
    $('hudNav').textContent = `${v.toFixed(0)} km/h`;
    $('hudOv').textContent = g ? `前後 ${g.gx >= 0 ? '+' : ''}${g.gx.toFixed(2)}G   左右 ${g.gy >= 0 ? '+' : ''}${g.gy.toFixed(2)}G` : '';
  }
  // グラフは常に流れるので毎フレーム描くが、0.08s 刻みで十分（1px 強しか動かない）
  if (GPANELS && Math.abs(utc - lastGraphUtc) > 0.08) {
    lastGraphUtc = utc;
    drawGraph($('graphSvg'), GPANELS, utc, GRAPH_SPAN, 1280, 360);
  }
  const p = trackAt(utc);
  if (p && mapNav) {
    const ll = L.latLng(p.lat, p.lon);
    curNav.setLatLng(ll); curOv.setLatLng(ll);
    if (!navPos || ll.distanceTo(navPos) > 3) { mapNav.panTo(ll, { animate: false }); navPos = ll; }
  }
  $('tlabel').textContent = `${fmt(S - winS0)} / ${fmt(winS1 - winS0)}   ${new Date(utc * 1000).toLocaleTimeString('ja-JP')}`
    + (perf.fps ? `   [${perf.fps}fps 描画${perf.ms}ms]` : '');
  $('seek').value = Math.round(((S - winS0) / (winS1 - winS0)) * 1000);
}

// ─────────────────────────────── 動画（クリップ2枚のダブルバッファ）
function urlOf(c, rear) {
  if (rear) { if (!c.rearFile) return null; if (!c.rearUrl) c.rearUrl = URL.createObjectURL(c.rearFile); return c.rearUrl; }
  if (!c.url) c.url = URL.createObjectURL(c.file);
  return c.url;
}
function clipAtS(s) {
  for (let i = 0; i < clipOrder.length; i++) { const c = CLIPS.get(clipOrder[i]); if (s >= c.S0 && s < c.S0 + c.duration) return i; }
  return -1;
}
function nextClipIdx(i) { return i + 1 < clipOrder.length ? i + 1 : -1; }
let curIdx = -1;
async function setSrc(v, name, url, offset, dur) {
  if (!url) { v.dataset.clip = ''; v.removeAttribute('src'); return; }   // リア欠けクリップは黒のまま
  if (v.dataset.clip !== name) {
    v.dataset.clip = name; v.src = url;
    await new Promise((res) => { const h = () => { v.removeEventListener('loadedmetadata', h); res(); }; v.addEventListener('loadedmetadata', h); });
  }
  v.currentTime = Math.max(0, Math.min(offset, (v.duration || dur) - 0.02));
}
async function loadInto(vi, idx, offset) {
  const name = clipOrder[idx], c = CLIPS.get(name);
  // リアは前方と長さ・境界が完全一致（実測 差0.000s / creation_time 同一）なので同じ offset を与える
  await Promise.all([setSrc(V[vi], name, urlOf(c, false), offset, c.duration),
                     setSrc(VR[vi], name, urlOf(c, true), offset, c.duration)]);
}
function show(vi) {
  for (const arr of [V, VR]) { arr[vi].classList.remove('off'); arr[1 - vi].classList.add('off'); arr[1 - vi].pause(); }
  act = vi;
}
async function seekTo(s, keepPlaying = playing) {
  S = Math.max(winS0, Math.min(winS1, s));
  let idx = clipAtS(S);
  if (idx < 0) {                                       // 欠けクリップ → 次に存在するクリップへ
    idx = clipOrder.findIndex((n) => CLIPS.get(n).S0 >= S);
    if (idx < 0) { setPlay(false); return; }
    S = CLIPS.get(clipOrder[idx]).S0;
  }
  curIdx = idx; pending = { idx: -1, ready: false };
  await loadInto(act, idx, S - CLIPS.get(clipOrder[idx]).S0);
  show(act);
  if (keepPlaying) { V[act].play().catch(() => {}); if (rearOn && VR[act].dataset.clip) VR[act].play().catch(() => {}); }
  render();
}
function setPlay(p) {
  playing = p; $('playBtn').textContent = p ? '❚❚' : '▶';
  if (p) {
    if (S >= winS1 - 0.1) { seekTo(winS0, true); return; }
    V[act].play().catch(() => {});
    if (rearOn && VR[act].dataset.clip) VR[act].play().catch(() => {});
  } else { V[act].pause(); VR[act].pause(); }
}
function tick() {
  requestAnimationFrame(tick);
  const _t = performance.now();
  if (curIdx < 0) return;
  const c = CLIPS.get(clipOrder[curIdx]);
  const v = V[act];
  if (playing && !v.paused) S = c.S0 + v.currentTime;
  if (S >= winS1) { setPlay(false); S = winS1; }
  // 先読み: 残り PRELOAD_SEC を切ったら次クリップを裏で用意
  const remain = (v.duration || c.duration) - v.currentTime;
  const ni = nextClipIdx(curIdx);
  if (playing && ni >= 0 && remain < PRELOAD_SEC && pending.idx !== ni) {
    const mine = { idx: ni, ready: false };
    pending = mine;
    loadInto(1 - act, ni, 0).then(() => { if (pending === mine) mine.ready = true; })
      .catch(() => { if (pending === mine) pending = { idx: -1, ready: false }; });
  }
  // 切替
  if (playing && (v.ended || remain <= 0.05) && pending.idx >= 0 && pending.ready) {
    const ni2 = pending.idx; pending = { idx: -1, ready: false };
    curIdx = ni2; show(1 - act);
    for (const a of [V, VR]) a[act].playbackRate = rate;
    V[act].play().catch(() => {});
    if (rearOn && VR[act].dataset.clip) VR[act].play().catch(() => {});
  }
  // リアは前方に追従（ドリフトしたら currentTime を合わせ直す）
  const vr = VR[act];
  if (rearOn && vr.dataset.clip) {
    if (Math.abs(vr.currentTime - v.currentTime) > 0.15) vr.currentTime = v.currentTime;
    if (playing && vr.paused) vr.play().catch(() => {});
    if (!playing && !vr.paused) vr.pause();
  }
  render();
}


// ─────────────────────────────── UI
function fitStage() {
  const w = $('stageWrap').clientWidth, h = $('stageWrap').clientHeight;
  const k = Math.min(w / 1920, h / 1080);
  const st = $('stage');
  st.style.transform = `scale(${k})`;
  st.style.left = Math.max(0, (w - 1920 * k) / 2) + 'px';
  st.style.top = Math.max(0, (h - 1080 * k) / 2) + 'px';
}
addEventListener('resize', fitStage);

let dirEntries = null, dirLabel = null;
$('pickDir').onclick = async () => {
  try {
    const h = await window.showDirectoryPicker();
    msg('フォルダを走査中…');
    dirEntries = await collectFromDirectory(h);
    dirLabel = h.name;                       // 絶対パスは API から取得できないので名前だけ保持
    $('dirName').textContent = `${h.name} (${dirEntries.length} ファイル)`;

  } catch (e) { if (e.name !== 'AbortError') msg('フォルダ選択に失敗: ' + e.message + '\n下の複数ファイル選択を使ってください。'); }
};
if (!window.showDirectoryPicker) { $('pickDir').disabled = true; $('dirName').textContent = 'この環境では非対応（下の複数選択を使用）'; }

/*
 * 「読み込み」＝スキャンだけ。走行の一覧を出し、選ばれてから全文解析に入る。
 * 走行が1件しか無ければ選ばせる意味が無いのでそのまま読む。
 */
let SCAN = null;
const hhmm = (t) => new Date(t * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const durLabel = (s2) => { const m = Math.round(s2 / 60); return m >= 60 ? `${Math.floor(m / 60)}時間${String(m % 60).padStart(2, '0')}分` : `${m}分`; };

function showSessions() {
  const list = $('sessList');
  list.innerHTML = '';
  for (const se of SCAN.sessions) {
    const b = document.createElement('button');
    b.className = 'sess';
    b.innerHTML = `<span class="sd">${hhmm(se.from)}</span>`
                + `<span class="sl">${durLabel(se.to - se.from)}</span>`
                + `<span class="sn">${se.n} クリップ　〜${hhmm(se.to)}</span>`;
    b.onclick = () => startLoad(se);
    list.appendChild(b);
  }
  $('sessWrap').style.display = 'block';
  msg(`${SCAN.sessions.length} 件の走行が見つかった。見たいものを選ぶ。`);
}

async function startLoad(sess) {
  try {
    $('goBtn').disabled = true;
    for (const b of $('sessList').querySelectorAll('button')) b.disabled = true;
    const m = await load(SCAN, sess);
    $('loader').style.display = 'none'; $('app').classList.add('on');
    fitStage(); buildMaps();
    V.push($('vA'), $('vB')); VR.push($('vRA'), $('vRB'));
    /*
     * 画面には「読む人が対処できること」だけ出す。
     * アンカーの外れ値・重複除去の内訳・セッション数といった内部診断は
     * 開発時にしか意味が無いので console に回す（sync.json にも全部入っている）。
     */
    console.log('[同期]', m);
    const notes = [];
    if (m.data.nFixes === 0) notes.push('測位データが無いため地図と標高は出ません');
    if (!(m.window.durationSec > 0)) notes.push('映像と測位の重なりがありません');
    const filled = FILLS.filter((q) => q.ok).length, failed = FILLS.filter((q) => !q.ok).length;
    if (filled) notes.push(`測位が途切れた ${filled} 区間（トンネル等）を地図の道路形状から補いました（破線。標高・勾配は出ません）`);
    if (failed) notes.push(`補えなかった途絶が ${failed} 箇所あります（地図の線はそこで切れます）`);
    $('warn').textContent = notes.join('  /  ');
    await seekTo(winS0, false);
    tick();
  } catch (e) {
    $('goBtn').disabled = false;
    for (const b of $('sessList').querySelectorAll('button')) b.disabled = false;
    msg('読み込み失敗: ' + e.message); console.error(e);
  }
}

$('goBtn').onclick = async () => {
  try {
    const entries = dirEntries || collectFromInput($('fFiles').files);
    if (!dirLabel && entries.length) {
      const rp = entries[0].path || '';
      if (rp.includes('/')) dirLabel = rp.split('/')[0];   // webkitRelativePath の先頭がフォルダ名
    }
    if (!entries.length) return msg('ドラレコのフォルダ、または MP4+NMEA を選んでください');
    $('goBtn').disabled = true;
    SCAN = await scanSessions(entries);
    $('goBtn').disabled = false;
    if (SCAN.sessions.length === 1) return startLoad(SCAN.sessions[0]);
    showSessions();
  } catch (e) { $('goBtn').disabled = false; msg('読み込み失敗: ' + e.message); console.error(e); }
};

$('rearBtn').onclick = () => {
  rearOn = !rearOn;
  $('rearBtn').classList.toggle('on', rearOn);
  for (const v of VR) { if (!rearOn) v.pause(); v.style.visibility = rearOn ? '' : 'hidden'; }
  if (rearOn && playing && VR[act].dataset.clip) { VR[act].currentTime = V[act].currentTime; VR[act].play().catch(() => {}); }
};
(function initTileStyle() {
  const sel = $('tileStyle');
  for (const [k, v] of Object.entries(TILE_STYLES)) {
    const o = document.createElement('option'); o.value = k; o.textContent = v.label; sel.appendChild(o);
  }
  sel.value = tileStyle;
  sel.onchange = () => { tileStyle = sel.value; localStorage.setItem(TILE_KEY, tileStyle); applyTileStyle(); };
})();
$('playBtn').onclick = () => setPlay(!playing);
$('seek').oninput = (e) => { seekTo(winS0 + (winS1 - winS0) * (e.target.value / 1000)); };
$('back5').onclick = () => seekTo(S - 5);
$('fwd10').onclick = () => seekTo(S + 10);
for (const el of document.querySelectorAll('.spd[data-s]')) el.onclick = () => {
  document.querySelectorAll('.spd[data-s]').forEach((x) => x.classList.remove('on'));
  el.classList.add('on'); rate = +el.dataset.s; for (const v of [...V, ...VR]) v.playbackRate = rate;
};

// ─────────────────────────────── 書き出し（地図とグラフを1本の動画に）
/*
 * 書き出しキャンバスは表示と同じ 1920×1080。映像セル（前方/リア）は黒のままにして
 * ffmpeg が上に重ねる。H.264 なので黒面はほぼ容量を食わず、crop を挟まないぶん
 * 合成コマンドが単純になる（レイアウト変更にも追随しやすい）。
 * オーバーレイに載るのは ナビ / 俯瞰 / グラフ の3つだけ。
 */
const EXP = { W: 1920, H: 1080, dir: null, stop: false, running: false };
const CELL = { video: [0, 0, 1280, 720], rear: [1280, 0, 640, 360],
               nav: [1280, 360, 640, 360], ov: [1280, 720, 640, 360],
               graph: [0, 720, 1280, 360] };

function svgDataUrl(svgEl, w, h) {
  const c = svgEl.cloneNode(true);
  // 単体画像として描画するので、位置指定は必ず落とす（position:absolute が残ると全面空白になる）
  c.removeAttribute('style');
  c.removeAttribute('class');
  c.setAttribute('width', w); c.setAttribute('height', h);
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
}
/** グラフを画像化。毎フレーム流れるのでキャッシュは効かない */
async function graphImageFor(utc) {
  if (!GPANELS) return null;
  drawGraph($('expGraph'), GPANELS, utc, GRAPH_SPAN, CELL.graph[2], CELL.graph[3]);
  const img = new Image();
  img.src = svgDataUrl($('expGraph'), CELL.graph[2], CELL.graph[3]);
  await img.decode();
  return img;
}
function ffmpegCommand(fps, ovIn, ovNote) {
  const w0 = (S) => S.toFixed(3);
  /*
   * filter_complex は1本の引数。改行を入れない（Windows の cmd/PowerShell では行継続記号が
   * 異なるため、1行にしておくのが Win/Mac 共通で唯一安全な形）。
   * オーバーレイ自体が 1920×1080 の下地なので、映像2本を所定位置に重ねるだけで済む。
   */
  const [vx, vy, vw, vh] = CELL.video, [rx, ry, rw, rh] = CELL.rear;
  const fc = [
    `[0:v]trim=start=${w0(winS0)}:end=${w0(winS1)},setpts=PTS-STARTPTS,scale=${vw}:${vh},fps=30[f]`,
    `[1:v]trim=start=${w0(winS0)}:end=${w0(winS1)},setpts=PTS-STARTPTS,scale=${rw}:${rh},fps=30[r]`,
    '[2:v]fps=30[t]',
    `[t][f]overlay=${vx}:${vy}:shortest=1[a]`,
    `[a][r]overlay=${rx}:${ry}:shortest=1[v]`,
  ].join(';');
  // -nostdin は必須。付けないと、この後に続く行を ffmpeg が対話コマンドとして読み取ってしまう。
  const cmd = `ffmpeg -nostdin -hide_banner -f concat -safe 0 -i concat_front.txt -f concat -safe 0 -i concat_rear.txt `
    + `${ovIn} -filter_complex "${fc}" -map "[v]" `
    + `-c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 30 -an -movflags +faststart out.mp4`;
  return [
    '# ドラレコ走行ビューア 書き出し',
    `# オーバーレイ: ${ovNote}  ${fps}fps`,
    '# このフォルダで下の1行を実行する（Windows は cmd / PowerShell どちらでも可）',
    '', cmd, '',
  ].join('\n');
}
async function makeEncoder(fps, onChunk) {
  if (typeof VideoEncoder === 'undefined') return null;
  const cands = ['avc1.4D0033', 'avc1.640033', 'avc1.42E033', 'avc1.4D401F', 'avc1.42E01E'];
  for (const codec of cands) {
    const cfg = { codec, width: EXP.W, height: EXP.H, framerate: fps, bitrate: 6e6,
                  avc: { format: 'annexb' }, latencyMode: 'quality' };
    try {
      const sup = await VideoEncoder.isConfigSupported(cfg);
      if (!sup || !sup.supported) continue;
      const enc = new VideoEncoder({
        output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); onChunk(b); },
        error: (e) => { console.error('VideoEncoder', e); },
      });
      enc.configure(sup.config || cfg);
      return { enc, codec };
    } catch (e) { /* 次の候補へ */ }
  }
  return null;
}
async function writeText(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable(); await w.write(new Blob([text])); await w.close();
}

async function runExport() {
  const fps = +$('expFps').value, quality = +$('expQ').value / 100, root = $('expRoot').value.trim();
  if (!EXP.dir) return ($('expStat').textContent = '出力先フォルダを選んでください');
  if (!root) return ($('expStat').textContent = 'ドラレコ SD の絶対パスを入力してください（concat リスト生成に必要）');
  localStorage.setItem(ROOT_KEY, root);
  EXP.stop = false; EXP.running = true;
  const wasPlaying = playing; setPlay(false);
  const sep = root.includes('\\') ? '\\' : '/';
  const join = (a, b) => a.replace(/[\/\\]+$/, '') + sep + b.split('/').join(sep);

  // concat リスト（セッションのクリップのみ・絶対パス）
  const fl = [], rl = [];
  for (const n of clipOrder) {
    const c = CLIPS.get(n);
    fl.push(`file '${join(root, c.path)}'`);
    rl.push(`file '${join(root, c.rearPath || c.path)}'`);
  }
  await writeText(EXP.dir, 'concat_front.txt', fl.join('\n') + '\n');
  await writeText(EXP.dir, 'concat_rear.txt', rl.join('\n') + '\n');
  await writeText(EXP.dir, 'sync.json', JSON.stringify(MAN, null, 2));

  let wq = Promise.resolve(), bytes = 0;
  const chunkOut = (b) => { bytes += b.length; wq = wq.then(() => ws.write(b)); };
  const E = await makeEncoder(fps, chunkOut);
  const ovName = E ? 'overlay.h264' : 'overlay.mjpeg';
  const fh0 = await EXP.dir.getFileHandle(ovName, { create: true });
  const ws = await fh0.createWritable();
  const ovIn = E ? `-f h264 -framerate ${fps} -i overlay.h264` : `-f mjpeg -framerate ${fps} -i overlay.mjpeg`;
  const ovNote = E ? `overlay.h264（生H.264 Annex-B / ${E.codec}）` : 'overlay.mjpeg（MJPEG）';
  await writeText(EXP.dir, 'compose.txt', ffmpegCommand(fps, ovIn, ovNote));

  const cv = new OffscreenCanvas(EXP.W, EXP.H), ctx = cv.getContext('2d');
  const cache = new TileCache(TILE_STYLES[tileStyle].url);
  const attrib = TILE_STYLES[tileStyle].attrib;
  // 経路の見た目は再生画面と同じ規則（車速の色分け・補完区間は破線）
  const styleOf = (i) => ({ col: spdColor(TMETA[i].spd), w: spdWeight(TMETA[i].spd),
                            dash: TRACK[i].estimated ? [6, 5] : null });

  /*
   * マップの縮尺は「書き出しボタンを押した時点の再生アプリの表示状態」に固定する。
   * 再生アプリのマップセルは 640×360 で書き出しキャンバスと同寸（CSS の transform は
   * clientWidth を変えない）ため、ズーム値をそのまま流用できる。
   * 自前のタイル描画は整数ズームのみ対応なので丸める。
   */
  const ovZ = mapOv ? Math.round(mapOv.getZoom()) : null;
  const ovC = mapOv ? mapOv.getCenter() : null;
  const [ovX, ovY, ovW, ovH] = CELL.ov;
  const ovFit = (ovZ != null && ovC) ? { z: ovZ, lat: ovC.lat, lon: ovC.lng } : fitView(TRACK, ovW, ovH);
  // 俯瞰は自車以外が静的 → 一度だけ描いて毎フレーム転写する
  const ovView = makeView(ovFit.lat, ovFit.lon, ovFit.z, ovW, ovH);
  const ovBase = new OffscreenCanvas(ovW, ovH), octx = ovBase.getContext('2d');
  octx.fillStyle = '#0d1218'; octx.fillRect(0, 0, ovW, ovH);
  await drawTiles(octx, cache, ovView, 0, 0);
  drawRoute(octx, TRACK, TMETA, ovView, 0, 0, { styleOf });
  drawDot(octx, ovView, TRACK[0].lat, TRACK[0].lon, 0, 0, { r: 5, fill: '#2ecc71', ring: '#2ecc71', rw: 1 });
  drawDot(octx, ovView, TRACK[TRACK.length - 1].lat, TRACK[TRACK.length - 1].lon, 0, 0, { r: 5, fill: '#e74c3c', ring: '#e74c3c', rw: 1 });
  drawAttribution(octx, attrib, 0, 0, ovW, ovH);
  const [nvX, nvY, nvW, nvH] = CELL.nav;
  const navZ = mapNav ? Math.round(mapNav.getZoom()) : zoomForSpan(FOLLOW_SPAN_M, Math.min(nvW, nvH), TRACK[0].lat);

  $('expStat').textContent = `縮尺を固定: ナビ z${navZ} / 俯瞰 z${ovFit.z}（押した時点の表示状態）\n準備中…`;
  const total = Math.ceil((winS1 - winS0) * fps);
  const t0 = performance.now();
  for (let k = 0; k < total; k++) {
    if (EXP.stop) break;
    const Sk = winS0 + k / fps;
    const utc = TL.sToUtc(Sk);
    const p = trackAt(utc);
    ctx.fillStyle = '#0a1520'; ctx.fillRect(0, 0, EXP.W, EXP.H);
    ctx.fillStyle = '#000';                              // 映像セルは黒（ffmpeg が上に重ねる）
    ctx.fillRect(...CELL.video); ctx.fillRect(...CELL.rear);
    const gim = await graphImageFor(utc);
    if (gim) ctx.drawImage(gim, CELL.graph[0], CELL.graph[1]);
    ctx.drawImage(ovBase, ovX, ovY);
    if (p) drawDot(ctx, ovView, p.lat, p.lon, ovX, ovY);
    if (p) {
      const nv = makeView(p.lat, p.lon, navZ, nvW, nvH);
      ctx.save(); ctx.beginPath(); ctx.rect(nvX, nvY, nvW, nvH); ctx.clip();
      ctx.fillStyle = '#0d1218'; ctx.fillRect(nvX, nvY, nvW, nvH);
      await drawTiles(ctx, cache, nv, nvX, nvY);
      const [a, b] = visibleRange(TRACK, nv, p.i);
      drawRoute(ctx, TRACK, TMETA, nv, nvX, nvY, { styleOf, from: a, to: b });
      drawDot(ctx, nv, p.lat, p.lon, nvX, nvY);
      drawAttribution(ctx, attrib, nvX, nvY, nvW, nvH);
      ctx.restore();
    }
    if (E) {
      const vf = new VideoFrame(cv, { timestamp: Math.round((k / fps) * 1e6), duration: Math.round(1e6 / fps) });
      E.enc.encode(vf, { keyFrame: k % (fps * 2) === 0 });
      vf.close();
      while (E.enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));   // バックプレッシャ
    } else {
      chunkOut(new Uint8Array(await (await cv.convertToBlob({ type: 'image/jpeg', quality })).arrayBuffer()));
    }
    if (k % 10 === 0 || k === total - 1) {
      const el = (performance.now() - t0) / 1000, rate = (k + 1) / el;
      $('expStat').textContent =
        `ナビ z${navZ} / 俯瞰 z${ovFit.z}   ${ovName}\n${k + 1} / ${total} フレーム (${(((k + 1) / total) * 100).toFixed(1)}%)  ${rate.toFixed(1)} fps\n`
        + `経過 ${(el / 60).toFixed(1)}分  残り ${(((total - k - 1) / rate) / 60).toFixed(1)}分  `
        + `書き込み ${(bytes / 1e6).toFixed(0)} MB (推定合計 ${((bytes / (k + 1)) * total / 1e6).toFixed(0)} MB)\n`
        + `タイル取得 ${cache.miss} / キャッシュヒット ${cache.hits}`;
      await new Promise((r) => setTimeout(r, 0));   // UI に制御を返す
    }
  }
  if (E) { await E.enc.flush(); E.enc.close(); }
  await wq; await ws.close();
  EXP.running = false;
  $('expStat').textContent += EXP.stop
    ? `\n中止した（${ovName} はここまでの分が残る）`
    : `\n完了 → ${ovName} (${(bytes / 1e6).toFixed(0)} MB)。compose.txt の ffmpeg コマンドを実行して合成する。`;
  if (wasPlaying) setPlay(true);
}

/*
 * SD の絶対パスは File System Access API から取得できない（handle は .name のみ）。
 * そのため「前回入力値を記憶」＋「フォルダ名からの推定」で自動補完する。
 * macOS のリムーバブルは /Volumes/<名前> に必ずマウントされるので推定が確実に効く。
 */
const ROOT_KEY = 'dashcam.sdroot';
function guessSdRoot() {
  const saved = localStorage.getItem(ROOT_KEY);
  if (saved && (!dirLabel || saved.replace(/[\/\\]+$/, '').endsWith(dirLabel))) return saved;
  const mac = /Mac/i.test(navigator.userAgent) || /Mac/i.test(navigator.platform || '');
  if (dirLabel && mac) return '/Volumes/' + dirLabel;
  return saved || '';
}
$('expBtn').onclick = () => {
  $('expPanel').classList.add('on');
  if (!$('expRoot').value) {
    const g = guessSdRoot();
    if (g) { $('expRoot').value = g; $('expStat').textContent = `SD の絶対パスを自動入力した（${g}）。違う場合は書き換える。`; }
  }
};
$('expClose').onclick = () => { $('expPanel').classList.remove('on'); };
$('expStop').onclick = () => { EXP.stop = true; };
$('expQ').oninput = (e) => { $('expQv').textContent = e.target.value; };
$('expPick').onclick = async () => {
  try {
    EXP.dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    $('expDir').textContent = EXP.dir.name;
  } catch (e) { if (e.name !== 'AbortError') $('expStat').textContent = 'フォルダ選択に失敗: ' + e.message; }
};
$('expGo').onclick = () => { if (!EXP.running) runExport().catch((e) => { EXP.running = false; $('expStat').textContent = '失敗: ' + e.message; console.error(e); }); };

$('dlSync').onclick = () => {
  const b = new Blob([JSON.stringify(MAN, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sync.json'; a.click();
};
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowLeft') seekTo(S - 5);
  else if (e.code === 'ArrowRight') seekTo(S + 10);
});
</script>
